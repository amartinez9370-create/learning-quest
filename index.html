      {q:"Which of these shows appreciation for one's own province's culture?", opts:["Participating in and learning about local festivals and traditions","Ignoring all local celebrations","Refusing to learn about local history","Making fun of local customs"], correct:0}
    ]},
  { key:"visualarts", title:"Elements of Visual Arts", icon:"🎨", color:"#b06bff", name:"FORESTER",
    greet:"When I carve wood, I think about line, shape, and texture just as much as any painter would. Know the elements of visual arts?",
    lesson:"The <b>elements of visual arts</b> include line, shape, color, texture, form, space, and value. Artists use these elements to create artworks.",
    thanks:"You have a real eye for art now!",
    quiz:[
      {q:"Which of these is an element of visual arts?", opts:["Line","Multiplication","Grammar","Composting"], correct:0},
      {q:"The element of visual arts that refers to how something feels (rough, smooth) is called:", opts:["Color","Texture","Space","Value"], correct:1},
      {q:"Red, blue, and yellow are examples of the element called:", opts:["Line","Color","Texture","Form"], correct:1},
      {q:"The lightness or darkness of a color is called its:", opts:["Value","Shape","Line","Space"], correct:0},
      {q:"A flat, two-dimensional outline (like a circle or square) is called a:", opts:["Shape","Texture","Value","Line"], correct:0},
      {q:"A three-dimensional object with height, width, and depth is called a:", opts:["Line","Form","Color","Texture"], correct:1},
      {q:"The empty or open area around and between objects in an artwork is called:", opts:["Space","Value","Shape","Form"], correct:0},
      {q:"Which of these describes 'line' as an element of visual art?", opts:["A mark that connects two points and can be straight or curved","The lightness or darkness of a color","A flat two-dimensional outline","An open area in an artwork"], correct:0},
      {q:"An artist uses different colors, shapes, and textures to create a work of:", opts:["Visual art","Mathematics","Chemistry","Grammar"], correct:0},
      {q:"Which combination correctly pairs an element of visual art with its description?", opts:["Texture - how something feels or appears to feel","Value - the shape of an object","Space - the color of an object","Line - the smell of a painting"], correct:0}
    ]},
  { key:"personalhealth", title:"Personal Health Care", icon:"🧼", color:"#3ddc84", name:"HUNTER TRAPPER", examReview:true,
    greet:"Days on the trail mean I have to take extra care of myself — clean hands, clean body, healthy me. Do you know your proper hygiene practices?",
    lesson:"<b>Personal health care</b> means practicing good hygiene to keep your body clean, healthy, and free from germs. This includes proper <b>handwashing</b>, <b>oral care</b> (caring for your teeth and mouth), <b>body care</b> (bathing and keeping your skin clean), and <b>genital care</b> (keeping your private body parts clean and healthy).",
    thanks:"You really know your hygiene practices!",
    quiz:[
      {q:"Washing your hands properly before eating helps prevent the spread of:", opts:["Germs and illness","Homework","Cultural traditions","Visual arts elements"], correct:0},
      {q:"Brushing your teeth and caring for your mouth is called:", opts:["Genital care","Oral care","Body care","Cultural care"], correct:1},
      {q:"Taking a daily bath to keep your skin clean is an example of:", opts:["Oral care","Genital care","Body care","None of these"], correct:2},
      {q:"Keeping your private body parts clean is part of:", opts:["Genital care","Cultural identity","Visual arts","Oral care"], correct:0},
      {q:"Why is proper hygiene important?", opts:["It keeps you healthy and prevents illness","It makes you taller","It is not important","It only matters for adults"], correct:0},
      {q:"When should you wash your hands?", opts:["Only once a day","Before eating and after using the restroom","Never","Only when visibly dirty"], correct:1},
      {q:"Which of these is an example of oral care?", opts:["Brushing your teeth after meals","Taking a bath","Washing your hands","Combing your hair"], correct:0},
      {q:"Keeping your body clean through regular bathing is called:", opts:["Oral care","Body care","Genital care","None of these"], correct:1},
      {q:"Practicing good personal hygiene helps prevent:", opts:["The spread of germs and illness","Better grades in math","Faster running speed","Taller height"], correct:0},
      {q:"Which of these is the best time to wash your hands?", opts:["After using the restroom and before eating","Only in the morning","Only once a week","Never, unless visibly dirty"], correct:0},
      {q:"A family that eats healthy meals and exercises together is practicing:", opts:["Family wellness","Cultural identity","Visual arts","Chemical safety"], correct:0},
      {q:"Which of these is an example of a healthy family habit?", opts:["Eating meals together and getting enough sleep","Skipping meals often","Staying up very late every night","Avoiding all physical activity"], correct:0},
      {q:"What is one way a family can support each other's health?", opts:["Encouraging each other to eat well and stay active","Ignoring each other's health needs","Only focusing on one family member's health","Avoiding doctor visits entirely"], correct:0},
      {q:"Which of the following is part of a 'current health status' check-up?", opts:["Checking height, weight, and overall body condition","Checking your favorite color","Checking your reading speed","Checking your math grades"], correct:0},
      {q:"Being aware of how your own body feels and functions is called:", opts:["Body awareness","Cultural awareness","Visual awareness","Musical awareness"], correct:0},
      {q:"Which of these is a sign that a family is practicing good wellness habits?", opts:["Regular exercise, balanced meals, and enough rest","Constant junk food and no exercise","No sleep schedule at all","Avoiding all forms of physical activity"], correct:0},
      {q:"Why is getting enough sleep every night important for your health?", opts:["It helps your body rest, grow, and recover","It has no effect on your health","It only matters for adults","It makes you more tired"], correct:0},
      {q:"Which of these activities can a family do together to promote wellness?", opts:["Going for a walk or playing sports together","Watching TV all day with no activity","Eating fast food every single meal","Avoiding time together"], correct:0},
      {q:"Monitoring your own body's health regularly helps you:", opts:["Notice changes early and stay healthy","Avoid all forms of exercise","Ignore your body's needs","Focus only on academics"], correct:0},
      {q:"A balanced diet, regular exercise, and proper hygiene together support:", opts:["Overall personal and family wellness","Only cultural identity","Only visual arts skills","Only musical skills"], correct:0}
    ]},
  { key:"senseorgans", title:"Care for the Sense Organs", icon:"👀", color:"#4dc9ff", name:"MOUNTAIN HUNTER",
    greet:"Out on the hunt, my eyes and ears have to stay sharp — I can't afford to let them go dull. Know how to take care of your five senses?",
    lesson:"We must take care of our five sense organs: eyes, ears, nose, tongue, and skin. Examples: avoid loud noises to protect ears, don't rub your eyes, avoid inserting objects into your nose or ears, and protect your skin from too much sun.",
    thanks:"Your senses are safe with what you know now!",
    quiz:[
      {q:"Which sense organ can be harmed by very loud noises?", opts:["Eyes","Ears","Tongue","Skin"], correct:1},
      {q:"What should you avoid doing to protect your eyes?", opts:["Reading in dim light for hours and rubbing them often","Wearing sunglasses outdoors","Blinking normally","Resting them when tired"], correct:0},
      {q:"You should never insert small objects into your:", opts:["Hands","Ears and nose","Feet","Hair"], correct:1},
      {q:"What can help protect your skin from the sun?", opts:["Staying indoors always","Using sunscreen or protective clothing","Ignoring sunburns","Avoiding baths"], correct:1},
      {q:"Which sense organ allows you to taste food?", opts:["Ears","Tongue","Skin","Nose"], correct:1},
      {q:"What can happen if you don't protect your ears from loud sounds?", opts:["Improved hearing","Hearing damage or loss","Better balance","Nothing happens"], correct:1},
      {q:"Which sense organ is used to smell things?", opts:["Eyes","Nose","Tongue","Skin"], correct:1},
      {q:"Which sense organ helps you feel textures like rough or smooth?", opts:["Skin","Tongue","Nose","Eyes"], correct:0},
      {q:"Wearing sunglasses outdoors on a bright day helps protect your:", opts:["Ears","Eyes","Tongue","Nose"], correct:1},
      {q:"How many main sense organs does the human body have?", opts:["3","4","5","6"], correct:2}
    ]},
  { key:"elementsofmusic", title:"Elements of Music", icon:"🎵", color:"#4dc9ff", name:"TRAVELING BARD",
    greet:"I play a different tune in every camp I visit! Can you tell the difference between loud and soft, or one instrument from another?",
    lesson:"Music is made up of different elements. <b>Timbre</b> is the unique quality or color of a sound (vocal or instrumental) that lets us tell instruments and voices apart. <b>Dynamics</b> refers to how loud or soft the music is. <b>Melody</b> is a pleasing sequence of musical notes.",
    thanks:"You've got a great ear for the elements of music!",
    quiz:[
      {q:"The unique quality of a sound that helps you tell a guitar apart from a piano is called:", opts:["Timbre","Dynamics","Tempo","Rhythm"], correct:0},
      {q:"The term for how loud or soft music is played is called:", opts:["Timbre","Dynamics","Melody","Pitch"], correct:1},
      {q:"A voice can be described by its timbre. Which of these is an example of timbre?", opts:["The unique sound quality of a singer's voice","The volume of the song","The speed of the song","The title of the song"], correct:0},
      {q:"If music suddenly becomes very loud, this change in dynamics could be described as:", opts:["Very soft","Very loud","Silent","Slow"], correct:1},
      {q:"Which of these is an example of a vocal sound source?", opts:["A person singing","A guitar","A drum","A piano"], correct:0},
      {q:"Which of these is an example of an instrumental sound source?", opts:["A person humming","A violin being played","A person whispering","A person clapping and singing"], correct:1},
      {q:"Which of these best describes 'melody' in music?", opts:["A pleasing sequence of musical notes","The loudness of a song","The type of instrument used","The dance that goes with a song"], correct:0},
      {q:"Why do different instruments sound different even when playing the same note?", opts:["Because of their unique timbre","Because of their color","Because of their price","Because of their size only"], correct:0},
      {q:"A song that gradually gets softer is showing a change in:", opts:["Dynamics","Timbre only","Instrument type","Melody"], correct:0},
      {q:"A song played entirely by instruments with no singing is called:", opts:["An instrumental piece","A vocal piece","A dynamic piece","A rhythm piece"], correct:0}
    ]},
  { key:"physicalfitness", title:"Physical Fitness and Movement", icon:"🏃", color:"#ff6f59", name:"CARAVAN GUARD",
    greet:"Guarding a caravan means staying strong and ready to move at all times. Do you know how to keep your body active and healthy through exercise?",
    lesson:"Regular physical activity and exercise keep our bodies strong and healthy. This includes basic movement skills like running, jumping, and stretching, as well as learning simple <b>local dance forms</b> that combine movement with our culture and traditions.",
    thanks:"You're ready to stay active and healthy!",
    quiz:[
      {q:"Why is regular physical activity important for your body?", opts:["It keeps your body strong and healthy","It makes you tired all day","It has no benefit","It only helps your eyes"], correct:0},
      {q:"Which of these is an example of a basic movement skill?", opts:["Running","Reading","Writing","Singing"], correct:0},
      {q:"Stretching before exercise helps to:", opts:["Prepare your muscles and prevent injury","Make you more tired","Slow down your heart rate permanently","Weaken your muscles"], correct:0},
      {q:"Dance forms that are practiced within a specific community or region are called:", opts:["Local dance forms","Foreign dance forms","Random movements","Sports equipment"], correct:0},
      {q:"Learning about local dance forms helps us appreciate:", opts:["Our culture and traditions","Only foreign cultures","Nothing important","Mathematics"], correct:0},
      {q:"Which of these is a benefit of regular exercise?", opts:["A stronger and healthier body","Weaker muscles","More illness","Less energy"], correct:0},
      {q:"Jumping, running, and skipping are examples of:", opts:["Basic movement skills","Cooking skills","Reading skills","Drawing skills"], correct:0},
      {q:"Why is it important to warm up before physical activity?", opts:["To prepare the body and avoid injury","It is not important","To make the activity harder","To waste time"], correct:0},
      {q:"Which of these combines movement with music and culture?", opts:["Dance","Silent reading","Solving math problems","Drawing a picture"], correct:0},
      {q:"A balanced routine of exercise and rest helps the body to:", opts:["Stay strong and recover properly","Become weaker","Get sick more often","Have less energy"], correct:0}
    ]},
  { key:"sinukwanfestival", title:"Creative Works in the Sinukwan Festival", icon:"🎭", color:"#e07a3e", name:"MOUNTAIN GUARD", examReview:true,
    greet:"I've stood watch on many mountains, but none as storied as Mt. Arayat, home of Aring Sinukwan. Do you know the festival that honors this old legend?",
    lesson:"The <b>Sinukwan Festival</b> is a Kapampangan festival from Pampanga that honors Aring Sinukwan, a legendary figure linked to Mount Arayat. It celebrates local culture through <b>sound</b> (music), <b>theater</b> (drama and acting), <b>dance</b> (street dancing), and <b>visual arts</b> (costumes and props) — showing how a community can bring its identity and traditions to life through creative works.",
    thanks:"You now understand how music, theater, dance, and visual arts come together to celebrate culture!",
    quiz:[
      {q:"The Sinukwan Festival is a cultural celebration from which province?", opts:["Pampanga","Cebu","Ilocos Norte","Palawan"], correct:0},
      {q:"The Sinukwan Festival is connected to a legendary figure associated with which mountain?", opts:["Mount Arayat","Mount Mayon","Mount Apo","Mount Pulag"], correct:0},
      {q:"Which of these is one of the FOUR basic concepts celebrated through creative works like the Sinukwan Festival?", opts:["Sound, theater, dance, and visual arts","Math, science, reading, and writing","Cooking, sewing, farming, and building","Swimming, running, jumping, and throwing"], correct:0},
      {q:"In the context of a festival, 'theater' refers to:", opts:["Drama, acting, and storytelling through performance","Only painting pictures","Only playing musical instruments","Only counting numbers"], correct:0},
      {q:"In the context of a festival, 'dance' refers to:", opts:["Movement performed to music, like street dancing","Sitting quietly","Reading a book","Doing math problems"], correct:0},
      {q:"Which element of a festival involves music, rhythm, and instruments?", opts:["Sound","Visual arts only","Only theater","None of these"], correct:0},
      {q:"Costumes, props, and decorations used in a festival performance are examples of:", opts:["Visual arts","Sound only","Theater only","Dance only"], correct:0},
      {q:"Festivals like the Sinukwan Festival help a community express its:", opts:["Cultural identity and local traditions","Only their math skills","Only their sports abilities","Only their cooking skills"], correct:0},
      {q:"Why do communities create festivals that combine music, dance, theater, and visual arts?", opts:["To celebrate and share their unique culture and traditions","To avoid celebrating their heritage","To replace the need for schools","To only entertain tourists"], correct:0},
      {q:"A street dance performance during a festival is an example of combining which elements?", opts:["Dance, sound (music), and visual arts (costumes)","Only math and science","Only reading and writing","Only farming skills"], correct:0},
      {q:"The Sinukwan Festival is an example of a creative work that reflects a community's:", opts:["Geographic and cultural identity","Weather patterns only","Sports statistics","Computer skills"], correct:0},
      {q:"Which of these would you most likely see during a cultural festival performance?", opts:["Traditional costumes, music, and dance","Math worksheets","Science lab equipment","Computer keyboards only"], correct:0},
      {q:"A festival that honors a legendary figure tied to local folklore is an example of celebrating a community's:", opts:["Cultural heritage and identity","Chemical properties","Mathematical formulas","Weather forecasts"], correct:0},
      {q:"Why is it valuable to study festivals like the Sinukwan Festival, even if you live in a different province?", opts:["It helps us appreciate the diversity of Philippine culture","It has no value at all","It replaces the need to learn about your own province","It is only useful for people from Pampanga"], correct:0},
      {q:"Which of these best describes how sound, theater, dance, and visual arts work together in a festival?", opts:["They combine to create a full creative performance celebrating culture","They are always performed separately and never together","Only one of these elements is ever used at a time","They have nothing to do with each other"], correct:0},
      {q:"A performer telling a story through acting and dialogue during a festival is using the element of:", opts:["Theater","Only visual arts","Only sound","Only dance"], correct:0},
      {q:"Which of these festivals, like the Sinukwan Festival, celebrates a specific province's local legends and traditions?", opts:["A provincial or regional cultural festival","A national exam","A weather report","A math competition"], correct:0},
      {q:"The word 'Aring' in 'Aring Sinukwan' suggests this figure was regarded as a kind of:", opts:["Ruler or king in local legend","Modern celebrity","Scientist","Athlete"], correct:0},
      {q:"Learning about festivals from other provinces, like the Sinukwan Festival, helps students understand:", opts:["The diversity and richness of Philippine cultural identity","That all provinces have identical traditions","That festivals are unimportant","That only their own province has culture"], correct:0},
      {q:"A festival that includes music, dance, theater, and visual arts together is a creative way to:", opts:["Bring a community's culture and identity to life","Avoid learning about tradition","Replace formal education","Ignore local history"], correct:0}

  { key:"targetgames", title:"Move, Aim, and Score: Target Game Skills", icon:"🎯", color:"#4dc9ff", name:"WOODLAND RANGER", examReview:true,
    greet:"A steady hand and a sharp eye — that's what it takes to hit your mark, whether hunting or playing a target game. Ready to test your aim?",
    lesson:"<b>Target games</b> are physical activities where players try to send or land an object at a specific target, like Tumbang Preso, Tatsing, or Batuhang Bola. These games build <b>agility</b> (quick movement), <b>balance</b>, <b>coordination</b>, and <b>speed</b> through <b>locomotor skills</b> (moving the body, like running or dodging) and <b>manipulative skills</b> (controlling an object, like throwing or striking).",
    thanks:"Bullseye! You really know your target game skills now!",
    quiz:[
      {q:"What is the main goal of a target game?", opts:["To send or land an object onto a specific target","To run as far as possible","To swim across a pool","To sing a song correctly"], correct:0},
      {q:"Which of these is an example of a Filipino target game?", opts:["Tumbang Preso","Basketball","Swimming","Volleyball"], correct:0},
      {q:"Skills that involve MOVING your whole body, like running or dodging, are called:", opts:["Locomotor skills","Manipulative skills","Visual skills","Musical skills"], correct:0},
      {q:"Skills that involve CONTROLLING an object, like throwing or striking, are called:", opts:["Manipulative skills","Locomotor skills","Cultural skills","Reading skills"], correct:0},
      {q:"Which of these is an example of a manipulative skill used in target games?", opts:["Throwing a ball at a target","Running in place","Sitting still","Reading a book"], correct:0},
      {q:"Which of these is an example of a locomotor skill used in target games?", opts:["Dodging or avoiding an object","Throwing a ball","Standing perfectly still","Writing a sentence"], correct:0},
      {q:"What does 'agility' mean in the context of physical games?", opts:["The ability to move quickly and easily","The ability to sing well","The ability to read fast","The ability to draw pictures"], correct:0},
      {q:"Why is 'balance' important when playing target games?", opts:["It helps you stay steady while aiming or moving","It has nothing to do with target games","It only matters for swimming","It only matters for reading"], correct:0},
      {q:"What does 'coordination' mean when playing a target game?", opts:["Using your eyes and body together smoothly to hit a target","Ignoring the target completely","Only using your voice","Only using your imagination"], correct:0},
      {q:"Why is speed useful in some target games?", opts:["It helps you react quickly and reach the target zone in time","It has no use in target games","It only matters in swimming races","It only matters in singing contests"], correct:0},
      {q:"In Tumbang Preso, what is the main object players try to hit?", opts:["A tin can (lata)","A basketball hoop","A soccer goal","A finish line"], correct:0},
      {q:"Which combination of skills is typically used in a target game like Tatsing?", opts:["Aiming, throwing, and coordination","Only singing and dancing","Only reading and writing","Only sitting and watching"], correct:0},
      {q:"What is an example of avoiding an object or obstacle during a target game?", opts:["Dodging to avoid being hit","Throwing the ball at the target","Standing in one place only","Sitting on the ground"], correct:0},
      {q:"Why do target games often require both locomotor AND manipulative skills?", opts:["Because players must move their body AND control an object to succeed","Because only one skill is ever needed","Because movement has nothing to do with these games","Because target games don't require any skill"], correct:0},
      {q:"Which of these best shows good aim in a target game?", opts:["Sending the object accurately to the intended target","Throwing the object anywhere at random","Refusing to throw the object","Closing your eyes while throwing"], correct:0},
      {q:"What physical benefit do you gain from regularly playing target games?", opts:["Improved coordination, balance, and agility","Improved reading speed only","Improved singing voice only","No physical benefit at all"], correct:0},
      {q:"Which of these games involves throwing an object to knock down a target?", opts:["Tumbang Preso","Chess","Checkers","Sudoku"], correct:0},
      {q:"Why is practicing target games considered good physical activity?", opts:["It builds motor skills while keeping the body active","It has no physical benefit","It only helps with memorization","It replaces the need for exercise"], correct:0},
      {q:"What should a player focus on to improve their accuracy in target games?", opts:["Aim, control, and steady movement","Speaking loudly","Wearing bright colors","Standing far from the target at all times"], correct:0},
      {q:"Which set of skills combines to help someone 'move, aim, and score' successfully in a target game?", opts:["Locomotor and manipulative skills with coordination and balance","Only singing skills","Only drawing skills","Only counting skills"], correct:0}
    ]}
]},

filipino: { label:"FILIPINO", sub:"Alamat at Wikang Filipino", icon:"📚", color:"#ff6f59", topics:[
  { key:"alamat", title:"Alamat", icon:"📜", color:"#ff6f59", name:"TRAVELING BARD",

      {q:"Ang alamat ay bahagi ng anong uri ng panitikan?", opts:["Panitikang-bayan (Folk literature)","Balitang pang-araw-araw","Siyentipikong pananaliksik","Patalastas"], correct:0},
      {q:"Alin sa mga sumusunod ang HINDI katangian ng alamat?", opts:["May elemento ng kababalaghan","Ipinapasa nang pasalita","Batay sa kasalukuyang balita","Nagpapaliwanag ng pinagmulan ng isang bagay"], correct:2},

  { key:"bahagingkuwento", title:"Mga Bahagi ng Kuwento", icon:"🎭", color:"#ffd23f", name:"YOUNG ADVENTURER",
    greet:"Bago pa lang ako sa paglalakbay, pero natutunan kong ang bawat magandang kuwento ay may maayos na ayos. Alam mo ba kung ano-ano ang mga bahagi nito?",
    lesson:"Ang isang kuwento ay may mahahalagang bahagi: ang <b>tauhan</b> (ang mga taong o hayop na gumaganap sa kuwento), ang <b>tagpuan</b> (kung saan at kailan naganap ang kuwento), ang <b>banghay</b> (ang pagkakasunod-sunod ng mga pangyayari), at ang <b>aral</b> (ang mahalagang matututuhan mula sa kuwento).",
    thanks:"Kabisado mo na ang mga bahagi ng kuwento! Magaling!",
    quiz:[

      {q:"Ang pagkakasunod-sunod ng mga pangyayari sa kuwento ay tinatawag na:", opts:["Banghay","Tagpuan","Tauhan","Aral"], correct:0},

      {q:"Kailangan ba ng bawat kuwento ang tauhan?", opts:["Oo, dahil sila ang gumaganap sa kuwento","Hindi, hindi kailangan","Minsan lang","Hindi alintana"], correct:0},
      {q:"Alin ang HINDI bahagi ng isang kuwento?", opts:["Tauhan","Tagpuan","Kalkulasyon","Banghay"], correct:2},
      {q:"Sa isang kuwento tungkol sa isang prinsesa sa kastilyo, ano ang tagpuan?", opts:["Ang prinsesa","Ang kastilyo","Ang aral","Ang banghay"], correct:1},
      {q:"Ang simula, gitna, at wakas ng kuwento ay bahagi ng:", opts:["Tauhan","Tagpuan","Banghay","Aral"], correct:2},
      {q:"Bakit mahalaga ang aral sa isang kuwento?", opts:["Dahil ito ang mahalagang matututuhan natin dito","Dahil ito lamang ang dapat tandaan","Dahil hindi ito mahalaga","Dahil ito ang pinakamahaba sa kuwento"], correct:0},
      {q:"Sino ang maaaring maging tauhan sa isang kuwento?", opts:["Tao lamang","Hayop lamang","Tao o hayop na gumaganap sa kuwento","Walang partikular na tuntunin"], correct:2}

  { key:"pagkakasunodsunod", title:"Pagkakasunod-sunod ng mga Pangyayari", icon:"🔢", color:"#3ddc84", name:"BLACKSMITH",
    greet:"Sa paggawa ng espada, kailangan kong sundin ang tamang ayos — una, pagkatapos, sa huli. Kaya mo bang sundin ang pagkakasunod-sunod ng mga pangyayari?",
    lesson:"Ginagamit ang mga <b>signal words</b> tulad ng <i>una, sumunod, pagkatapos,</i> at <i>sa huli</i> upang ipakita ang wastong pagkakasunod-sunod ng mga pangyayari sa isang kuwento.",
    thanks:"Sunod-sunod mong nasagot nang tama! Ang galing!",
    quiz:[

      {q:"Aling salita ang ginagamit sa pagtatapos ng isang salaysay?", opts:["Una","Sumunod","Sa huli","Bago"], correct:2},
      {q:"Ano ang tawag sa mga salitang tulad ng 'una, sumunod, pagkatapos, sa huli'?", opts:["Pang-uri","Signal words o pananda ng pagkakasunod-sunod","Pandiwa","Pang-abay ng oras lamang"], correct:1},
      {q:"Bakit mahalaga ang paggamit ng signal words sa pagsasalaysay?", opts:["Para gawing mas magulo ang kuwento","Para malinaw na maipakita ang pagkakasunod-sunod ng mga pangyayari","Para hindi maintindihan ng nakikinig","Hindi ito mahalaga"], correct:1},
      {q:"Piliin ang wastong pagkakasunod-sunod:", opts:["Una, Sumunod, Pagkatapos, Sa huli","Sa huli, Una, Sumunod, Pagkatapos","Pagkatapos, Una, Sa huli, Sumunod","Sumunod, Sa huli, Una, Pagkatapos"], correct:0},
      {q:"Anong salita ang gagamitin pagkatapos ng 'una' sa isang salaysay?", opts:["Sa huli","Sumunod","Kahapon","Ngayon"], correct:1},
      {q:"Alin sa mga sumusunod ang HINDI signal word ng pagkakasunod-sunod?", opts:["Una","Maganda","Sumunod","Sa huli"], correct:1},
      {q:"Kailan natin ginagamit ang salitang 'pagkatapos'?", opts:["Sa simula ng kuwento","Sa gitna o dulo ng pagsasalaysay, matapos ang naunang pangyayari","Hindi ito ginagamit","Bago pa man magsimula ang kuwento"], correct:1},
      {q:"Ang tamang pagkakasunod-sunod ng mga pangyayari ay tumutulong sa mambabasa upang:", opts:["Mas maintindihan ang daloy ng kuwento","Malito sa kuwento","Kalimutan ang kuwento","Hindi ito mahalaga"], correct:0},
      {q:"Piliin ang pangungusap na gumagamit ng signal word:", opts:["Kumain siya ng almusal.","Una, naligo siya bago kumain.","Masaya ang bata.","Malaki ang bahay nila."], correct:1}
    ]},

  { key:"realidadatpantasya", title:"Realidad at Pantasya", icon:"🦋", color:"#ff8fab", name:"PLAINS RANGER",

      {q:"Bakit mahalagang matutong ikumpara ang realidad at pantasya?", opts:["Upang maunawaan kung alin sa binasa ang maaaring mangyari at alin ang gawa-gawa lamang","Hindi ito mahalaga","Upang maging mas mahirap unawain ang kuwento","Wala itong silbi sa pagbasa"], correct:0},

  { key:"ibapanguritekstonaratibo", title:"Iba Pang Uri ng Tekstong Naratibo", icon:"📚", color:"#b06bff", name:"APOTHECARY",

      {q:"Ang pagbabahagi ng isang kawili-wiling karanasan tungkol sa unang araw sa paaralan ay maaaring ituring na:", opts:["Anekdota","Alamat","Pabula","Tula"], correct:0},

      {q:"Ang mga salitang 'masaya' at 'natutuwa' ay:", opts:["Kasingkahulugan","Kasalungat","Magkaiba ang uri","Wala sa mga nabanggit"], correct:0},

ap: { label:"ARALING PANLIPUNAN", sub:"Bansa at Heograpiya ng Pilipinas", icon:"🏛️", color:"#e07a3e", topics:[

/* ============================================================
   GLOBAL STATE
   ============================================================ */
let PROGRESS = {};
Object.keys(SUBJECTS).forEach(k=>{ PROGRESS[k] = Array(SUBJECTS[k].topics.length).fill(0); });

// Best star count (0-3) earned specifically on a topic's exam-review pool (the expanded
// 20-question set), keyed by topic key — sparse, only exam-review (pool) topics get an entry.
// Deliberately separate from PROGRESS: PROGRESS may already be 3 from a topic's ORIGINAL
// 10-question set, from before it became an exam-review topic — that old mastery shouldn't
// count as having cleared the new, larger pool. EXAM_PROGRESS starts everyone at 0 for every
// exam-review topic, regardless of prior PROGRESS, so the green-check badge only appears
// after a real attempt against the current pool.
let EXAM_PROGRESS = {};

let currentSubjectKey = null;

function CT(){ return SUBJECTS[currentSubjectKey].topics; } // current topics
function CP(){ return PROGRESS[currentSubjectKey]; } // current progress array

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

/* ============================================================
   SUBJECT PICKER
   ============================================================ */
function renderSubjectGrid(){
  const grid = document.getElementById('subjectGrid');
  grid.innerHTML = Object.keys(SUBJECTS).map(key=>{
    const s = SUBJECTS[key];
    const stars = PROGRESS[key].reduce((a,b)=>a+b,0);
    const total = s.topics.length * 3;
    return `<div class="pick-card" onclick="pickSubject('${key}')">
      <div class="em">${s.icon}</div>
      <div class="nm">${s.label}</div>
      <div class="ds">${s.sub}<br>${s.topics.length} topics</div>
      <div class="prog">⭐ ${stars}/${total}</div>
    </div>`;
  }).join('');
}
function pickSubject(key){
  sfxSelect();
  currentSubjectKey = key;
  initOverworld();
  showScreen('screen-overworld');
}
function goToSubjects(){
  currentSubjectKey = null;
  renderSubjectGrid();
  showScreen('screen-subject');
}

function buildOwGrid(){
  owGrid = [];
  for(let r=0;r<OW_ROWS;r++){ let row=[]; for(let c=0;c<OW_COLS;c++){ row.push('.'); } owGrid.push(row); }
  for(let c=0;c<OW_COLS;c++){ owGrid[0][c]='T'; owGrid[OW_ROWS-1][c]='T'; }
  for(let r=0;r<OW_ROWS;r++){ owGrid[r][0]='T'; owGrid[r][OW_COLS-1]='T'; }
  owGrid[1][7]='C'; owGrid[1][8]='C'; owGrid[1][9]='C';
  owGrid[2][7]='C'; owGrid[2][8]='G'; owGrid[2][9]='C';
  for(let r=5;r<=6;r++){ for(let c=7;c<=9;c++){ owGrid[r][c]='W'; } }
  [[2,4],[2,12],[4,2],[4,14],[9,2],[9,14],[11,4],[11,12]].forEach(([r,c])=>{ if(owGrid[r] && owGrid[r][c]==='.') owGrid[r][c]='T'; });
  [[3,5],[3,11],[10,5],[10,11]].forEach(([r,c])=>{ if(owGrid[r] && owGrid[r][c]==='.') owGrid[r][c]='F'; });
  for(let r=2;r<=10;r++){ owGrid[r][8]='P'; }
  for(let c=4;c<=13;c++){ owGrid[5][c]='P'; }
  for(let c=4;c<=13;c++){ owGrid[9][c]='P'; }
}
const OW_OBSTACLES = new Set(['T','W','C']);
function owTileAt(c,r){ if(r<0||r>=OW_ROWS||c<0||c>=OW_COLS) return 'T'; return owGrid[r][c]; }
function owNpcAt(c,r){ return owNpcList.find(q=>q.col===c && q.row===r); }
function owIsWalkable(c,r){
  const t = owTileAt(c,r);
  if(OW_OBSTACLES.has(t)) return false;
  if(t==='G') return true;
  if(owNpcAt(c,r)) return false;
  return true;
}
function owAllDone(){ return owNpcList.every(q=> CP()[q.topicIdx] > 0); }

function initOverworld(){
  document.getElementById('owSubjectLabel').textContent = SUBJECTS[currentSubjectKey].label;
  buildOwGrid();
  const topics = CT();
  owNpcList = topics.map((t,i)=>{
    const pos = NPC_POOL[i % NPC_POOL.length];
    return { topicIdx:i, col:pos[0], row:pos[1], title:t.title, icon:t.icon, color:t.color, name:t.name, greet:t.greet, lesson:t.lesson, thanks:t.thanks, quiz:t.quiz, examReview:t.examReview, topicKey:t.key };
  });
  owPlayer = { col:8, row:9, px:0, py:0, facing:'up', moving:false };
  owPlayer.px = owPlayer.col*TILE; owPlayer.py = owPlayer.row*TILE;
  owUpdateHud();
  owRender();
}

const owCanvas = document.getElementById('gameCanvas');
const owCtx = owCanvas.getContext('2d');

function owDrawTile(t,x,y){
  switch(t){
    case '.': owCtx.fillStyle = ((x/TILE+y/TILE)%2===0)?'#3d8b46':'#357d3e'; owCtx.fillRect(x,y,TILE,TILE); break;
    case 'P': owCtx.fillStyle='#c9a877'; owCtx.fillRect(x,y,TILE,TILE); owCtx.fillStyle='#b8935f'; owCtx.fillRect(x+2,y+2,TILE-4,TILE-4); break;
    case 'F':
      owCtx.fillStyle = ((x/TILE+y/TILE)%2===0)?'#3d8b46':'#357d3e'; owCtx.fillRect(x,y,TILE,TILE);
      owCtx.fillStyle='#ff9ecf'; owCtx.beginPath(); owCtx.arc(x+TILE/2,y+TILE/2,4,0,7); owCtx.fill();
      owCtx.fillStyle='#ffe27a'; owCtx.beginPath(); owCtx.arc(x+TILE/2,y+TILE/2,2,0,7); owCtx.fill();
      break;
    case 'W':
      owCtx.fillStyle='#2b7de0'; owCtx.fillRect(x,y,TILE,TILE);
      owCtx.strokeStyle='#8fc5ff'; owCtx.lineWidth=2;
      owCtx.beginPath(); owCtx.moveTo(x+4,y+TILE/2); owCtx.lineTo(x+TILE-4,y+TILE/2); owCtx.stroke();
      break;
    case 'T':
      owCtx.fillStyle='#2e7d3a'; owCtx.fillRect(x,y,TILE,TILE);
      owCtx.fillStyle='#7a5230'; owCtx.fillRect(x+TILE/2-4,y+TILE-18,8,16);
      owCtx.fillStyle='#1f5c2b'; owCtx.beginPath(); owCtx.arc(x+TILE/2,y+TILE/2-5,18,0,7); owCtx.fill();
      break;
    case 'C':
      owCtx.fillStyle='#7d7d8f'; owCtx.fillRect(x,y,TILE,TILE);
      owCtx.strokeStyle='#0a0916'; owCtx.lineWidth=2; owCtx.strokeRect(x+2,y+2,TILE-4,TILE-4);
      break;
    case 'G':
      owCtx.fillStyle='#4a3a1f'; owCtx.fillRect(x,y,TILE,TILE);
      owCtx.fillStyle = owAllDone() ? '#ffd23f' : '#5a4a2f';
      owCtx.fillRect(x+8,y+8,TILE-16,TILE-16);
      break;
  }
}
function owDrawNpc(q){
  const x=q.col*TILE, y=q.row*TILE;
  owCtx.fillStyle='rgba(0,0,0,0.25)'; owCtx.beginPath(); owCtx.ellipse(x+TILE/2,y+TILE-8,16,6.5,0,0,7); owCtx.fill();
  owCtx.fillStyle=q.color; owCtx.beginPath(); owCtx.arc(x+TILE/2,y+TILE/2,20,0,7); owCtx.fill();
  owCtx.strokeStyle='#0a0916'; owCtx.lineWidth=2; owCtx.stroke();
  owCtx.font='24px sans-serif'; owCtx.textAlign='center'; owCtx.textBaseline='middle';
  owCtx.fillText(q.icon, x+TILE/2, y+TILE/2+1);
  const stars = CP()[q.topicIdx];
  if(stars > 0){
    owDrawStarRow(x+TILE/2, y-9, stars);
  }
}
function owDrawStarRow(cx, cy, filledCount){
  const starSize = 9;
  const gap = 10;
  const startX = cx - gap;
  for(let i=0;i<3;i++){
    const sx = startX + i*gap;
    owDrawStar(sx, cy, starSize/2, i < filledCount);
  }
}
function owDrawStar(cx, cy, r, filled){
  const spikes = 5, outerR = r, innerR = r*0.45;
  owCtx.beginPath();
  for(let i=0;i<spikes*2;i++){
    const radius = i%2===0 ? outerR : innerR;
    const angle = (Math.PI/spikes)*i - Math.PI/2;
    const px = cx + Math.cos(angle)*radius;
    const py = cy + Math.sin(angle)*radius;
    if(i===0) owCtx.moveTo(px,py); else owCtx.lineTo(px,py);
  }
  owCtx.closePath();
  owCtx.fillStyle = filled ? '#ffd23f' : 'rgba(255,255,255,0.55)';
  owCtx.fill();
  owCtx.strokeStyle = '#0a0916'; owCtx.lineWidth = 1;
  owCtx.stroke();
}
function owDrawPlayer(){
  const x=owPlayer.px, y=owPlayer.py;
  owCtx.fillStyle='rgba(0,0,0,0.25)'; owCtx.beginPath(); owCtx.ellipse(x+TILE/2,y+TILE-8,16,6.5,0,0,7); owCtx.fill();
  owCtx.fillStyle='#4dc9ff'; owCtx.beginPath(); owCtx.arc(x+TILE/2,y+TILE/2,20,0,7); owCtx.fill();
  owCtx.strokeStyle='#0a0916'; owCtx.lineWidth=2; owCtx.stroke();
  owCtx.font='24px sans-serif'; owCtx.textAlign='center'; owCtx.textBaseline='middle';
  owCtx.fillText('🧑', x+TILE/2, y+TILE/2+1);
  owCtx.fillStyle='#ffd23f';
  let fx=x+TILE/2, fy=y+TILE/2;
  if(owPlayer.facing==='up') fy-=26; if(owPlayer.facing==='down') fy+=26;
  if(owPlayer.facing==='left') fx-=26; if(owPlayer.facing==='right') fx+=26;
  owCtx.beginPath(); owCtx.arc(fx,fy,4,0,7); owCtx.fill();
}
function owRender(){
  for(let r=0;r<OW_ROWS;r++){ for(let c=0;c<OW_COLS;c++){ owDrawTile(owGrid[r][c], c*TILE, r*TILE); } }
  owNpcList.forEach(owDrawNpc);
  owDrawPlayer();
}
const OW_MOVE_DURATION = 150;
function owTryMove(dir){
  if(owPlayer.moving || owModalOpen || owBattleActive) return;
  owPlayer.facing = dir;
  let dc=0,dr=0;
  if(dir==='up') dr=-1; if(dir==='down') dr=1; if(dir==='left') dc=-1; if(dir==='right') dc=1;
  const nc=owPlayer.col+dc, nr=owPlayer.row+dr;
  if(!owIsWalkable(nc,nr)){ owRender(); return; }
  owPlayer.moving = true;
  const startX=owPlayer.px, startY=owPlayer.py, endX=nc*TILE, endY=nr*TILE, startTime=performance.now();
  sfxStep();
  function anim(now){
    const t = Math.min(1,(now-startTime)/OW_MOVE_DURATION);
    owPlayer.px = startX+(endX-startX)*t; owPlayer.py = startY+(endY-startY)*t;
    owRender();
    if(t<1){ requestAnimationFrame(anim); }
    else{
      owPlayer.col=nc; owPlayer.row=nr; owPlayer.px=endX; owPlayer.py=endY; owPlayer.moving=false;
      owCheckGate(); owRender();
    }
  }
  requestAnimationFrame(anim);
}
function owCheckGate(){
  if(owTileAt(owPlayer.col,owPlayer.row)==='G'){
    if(owAllDone()){ owOpenEnding(); }
    else{ owOpenMessage("👑","CASTLE GATE","The gate is sealed! Help every quest-giver in the realm first, then come back to prove your skill!"); }
  }
}

function owInteract(){
  if(owModalOpen || owBattleActive) return;
  let dc=0,dr=0;
  if(owPlayer.facing==='up') dr=-1; if(owPlayer.facing==='down') dr=1;
  if(owPlayer.facing==='left') dc=-1; if(owPlayer.facing==='right') dc=1;

    // session restoring on page load (no prior local progress at risk of surprise loss)
    // applies the same way, silently.
    const result = await window.LQFirebase.loadProgress(user.uid);
    if(result.ok && result.data){
      const d = result.data;
      if(d.gender) playerGender = d.gender;
      if(d.playerName) playerName = d.playerName;
      if(d.progress){
        Object.keys(d.progress).forEach(subj=>{
          if(PROGRESS[subj]) applyProgressArray(subj, d.progress[subj]);
        });
        saveProgressLocal(); // keep local copy in sync so it's available if they later play signed-out
      }
      if(d.examProgress){
        // Lower stakes than PROGRESS (no leaderboard tie, no visible star count) — auto-merge
        // by taking the higher value per topic rather than prompting, so signing in never
        // regresses a real completed review even if the two sides disagree.
        Object.keys(d.examProgress).forEach(topicKey=>{
          const cloudVal = d.examProgress[topicKey] || 0;
          const localVal = EXAM_PROGRESS[topicKey] || 0;
          EXAM_PROGRESS[topicKey] = Math.max(cloudVal, localVal);
        });
        saveExamProgressLocal();
      }
    }
    updateSignInUI();
    // If the char-select modal happens to be open when sign-in completes, refresh it
    if(document.getElementById('charSelectOverlay').classList.contains('show')){
      renderCharacterOptions();
      document.getElementById('playerNameInput').value = playerName;
    }
    // If we now have a name (from cloud or already set), and the modal was only open
    // because this was first-launch, we can proceed straight to the game.
    if(playerName && !document.getElementById('charSelectOverlay').dataset.userOpened){
      closeCharacterSelect();
      renderRegionMap();
    }
  } else {
    updateSignInUI();
  }
}

async function handleSignInClick(){
  const btn = document.getElementById('signInBtn');
  const status = document.getElementById('signInStatus');
  if(!firebaseReady){
    if(status){ status.textContent = "Still connecting — try again in a moment."; status.className = 'signin-status error'; }
    else { showSignInFeedback("Still connecting — try again in a moment."); }
    return;
  }
  // Only warn if this device actually has local progress that a cloud sign-in could
  // overwrite — a fresh device/new player has nothing to lose, so skip straight to sign-in.
  if(sumProgressStars(PROGRESS) > 0){
    const proceed = await confirmSignInOverwrite();
    if(!proceed) return;
  }
  if(btn) btn.disabled = true;
  if(status){ status.textContent = "Opening Google sign-in..."; status.className = 'signin-status'; }
  const result = await window.LQFirebase.signIn();
  if(btn) btn.disabled = false;
  if(!result.ok){
    if(status){ status.textContent = "Sign-in didn't complete. You can still play without an account."; status.className = 'signin-status error'; }
    else { showSignInFeedback("Sign-in didn't complete. You can try again anytime."); }
  }
  // On success, handleAuthStateChange() fires automatically via the auth listener.
}

function showSignInFeedback(message){
  // Fallback for when handleSignInClick is triggered from a context with no #signInStatus
  // element to write to (e.g. the account popover on the region map) — without this, a
  // blocked/dismissed/failed Google sign-in from that entry point gave the player zero
  // feedback: the popover just closed and nothing else happened.
  owOpenModal(`
    <div class="modal-head"><div class="em">👤</div><div class="nm">Sign In</div></div>
    <div class="modal-text">${message}</div>
    <div class="modal-btnrow" style="display:flex; flex-direction:column; gap:10px;">
      <button class="pixel-btn" onclick="owCloseModal()">OK</button>
    </div>`);
}

function confirmSignInOverwrite(){
  // Shown only when signing in from a signed-out state with existing local progress.
  // Cloud always wins on sign-in now (see handleAuthStateChange) — no merge/keep-local
  // option — so this is the one chance to back out before local progress is replaced.
  return new Promise(resolve=>{
    window._lqSignInConfirmResolve = resolve;
    owOpenModal(`
      <div class="modal-head"><div class="em">☁️</div><div class="nm">Sign In?</div></div>
      <div class="modal-text">
        Signing in will load your account's saved progress and replace this device's local progress with it. This cannot be undone.
      </div>
      <div class="modal-btnrow" style="display:flex; flex-direction:column; gap:10px;">
        <button class="pixel-btn" onclick="resolveSignInConfirm(true)">Sign In</button>
        <button class="pixel-btn" onclick="resolveSignInConfirm(false)">Cancel</button>
      </div>`);
  });
}
function resolveSignInConfirm(proceed){
  owCloseModal();
  if(window._lqSignInConfirmResolve){
    window._lqSignInConfirmResolve(proceed);
    delete window._lqSignInConfirmResolve;
  }
}

async function handleSignOutClick(){

async function cloudSyncProgress(){
  if(!cloudUser || !firebaseReady) return; // no-op if not signed in
  await window.LQFirebase.saveProgress(cloudUser.uid, {
    displayName: cloudUser.displayName,
    photoURL: cloudUser.photoURL,
    progress: PROGRESS,
    examProgress: EXAM_PROGRESS,
    gender: playerGender,
    playerName: playerName
  });
}
function cloudSyncExamProgress(){
  // EXAM_PROGRESS rides along in the same document as PROGRESS (see cloudSyncProgress) —
  // this alias just keeps the call site at the star-award moment readable/explicit.
  return cloudSyncProgress();
}

function loadPlayerProfile(){
  try{
    const raw = localStorage.getItem('lqh_player_profile');
    if(raw){
      const data = JSON.parse(raw);
      if(data.gender) playerGender = data.gender;
      if(data.name) playerName = data.name;
      return true;
    }
  } catch(e){ /* localStorage unavailable — fall through to defaults */ }
  return false;
}
function savePlayerProfile(){
  try{
    localStorage.setItem('lqh_player_profile', JSON.stringify({ gender:playerGender, name:playerName }));
  } catch(e){ /* silent fail — session still works, just won't persist */ }
  cloudSyncProgress(); // no-op if not signed in
}
function loadProgressLocal(){
  // Local-only star progress, used whenever the player isn't signed in (or hasn't
  // signed in yet at boot time). Cloud data, once loaded, takes priority over this
  // — see handleAuthStateChange — matching the existing "signed-in always wins" rule.
  try{
    const raw = localStorage.getItem('lqh_progress');
    if(raw){
      const data = JSON.parse(raw);
      Object.keys(data).forEach(subj=>{
        if(PROGRESS[subj]) applyProgressArray(subj, data[subj]);
      });
    }
  } catch(e){ /* localStorage unavailable or corrupt — fall through to fresh PROGRESS */ }
}
function applyProgressArray(subjectKey, savedArr){
  // Copies a saved per-topic star array onto PROGRESS[subjectKey] by INDEX, without
  // shrinking or growing the live array to the saved array's length. A save made before
  // new topics were added to this subject is shorter than SUBJECTS[subjectKey].topics.length
  // today — a blind array replace would silently drop the new topics' slots (they'd vanish
  // instead of staying at their fresh 0), which made "every topic >=3" mastery checks report
  // true even though the newly-added topics had never been played.
  const live = PROGRESS[subjectKey];
  if(!Array.isArray(savedArr) || !live) return;
  for(let i=0; i<live.length; i++){
    if(i < savedArr.length) live[i] = savedArr[i];
    // else: leave live[i] at its current value (0 for a topic that didn't exist in the save)
  }
}
function saveProgressLocal(){
  try{
    localStorage.setItem('lqh_progress', JSON.stringify(PROGRESS));
  } catch(e){ /* silent fail — session still works, just won't persist */ }
}
function loadExamProgressLocal(){
  // Mirrors loadProgressLocal, but for EXAM_PROGRESS (see its declaration for why this is
  // tracked separately from PROGRESS). Sparse object keyed by topic key — merge onto
  // EXAM_PROGRESS rather than replace, though at boot EXAM_PROGRESS starts empty anyway.
  try{
    const raw = localStorage.getItem('lqh_exam_progress');
    if(raw){
      const data = JSON.parse(raw);
      Object.keys(data).forEach(topicKey=>{ EXAM_PROGRESS[topicKey] = data[topicKey]; });
    }
  } catch(e){ /* localStorage unavailable or corrupt — fall through to fresh EXAM_PROGRESS */ }
}
function saveExamProgressLocal(){
  try{
    localStorage.setItem('lqh_exam_progress', JSON.stringify(EXAM_PROGRESS));
  } catch(e){ /* silent fail — session still works, just won't persist */ }
}

function renderPokeBattle(message, showLesson){
  const npc = owActiveQuest;
  const qItem = npc.quiz[pokeState.quizOrder[pokeState.qIdx % pokeState.quizOrder.length]];
  const villagerPct = Math.max(0, pokeState.villagerHP/pokeState.villagerMax*100);
  const heroPct = Math.max(0, pokeState.heroMP/pokeState.heroMax*100);
  const villagerColor = villagerPct>=100?'var(--green)':villagerPct>=50?'var(--yellow)':'#d9822b';
  const heroColor = heroPct>50?'var(--blue)':heroPct>25?'var(--yellow)':'var(--red)';

  // Shuffle the display order of options so the correct answer isn't always in the same slot
  const order = shuffleArr(qItem.opts.map((o,i)=>i));
  pokeCurrentOptOrder = order;
  let opts = order.map((origIdx,displayIdx)=>`<button class="poke-move" data-i="${displayIdx}" onclick="pokeAnswer(${displayIdx})">${qItem.opts[origIdx]}</button>`).join('');
  const bottomHtml = `
      <div class="poke-textbox" id="pokeText">${qItem.q}</div>
      ${qItem.visual? `<div class="poke-visual">${qItem.visual}</div>`:''}
      <div class="poke-moves" id="pokeMoves">${opts}</div>
    `;

  pokeArena.innerHTML = `
    <div class="poke-field">
      <div class="poke-enemy-row">
        <div class="poke-hud enemy">
          <div class="pname">${npc.name}</div>
          <div class="poke-hp-outer"><div class="poke-hp-inner" id="pokeVillagerBar" style="width:${villagerPct}%; background:${villagerColor};"></div></div>
          <div class="poke-hp-numbers">HP ${Math.round(villagerPct)}%</div>
        </div>
        <div class="poke-enemy-zone">
          <div class="poke-sprite-wrap">
            <div class="poke-enemy-platform"></div>
            <div class="poke-enemy-sprite" id="pokeVillagerSprite">${npc.sprite && NPC_SPRITES[npc.sprite] ? `<img src="${NPC_SPRITES[npc.sprite]}" alt="${npc.name}" style="width:100%; height:100%; object-fit:contain; object-position:bottom; transform:scaleX(-1);"/>` : emojiSVG(npc.icon, npc.color)}</div>
          </div>
        </div>
      </div>
      <div class="poke-hero-row">
        <div class="poke-hero-zone">
          <div class="poke-sprite-wrap hero-wrap">
            <div class="poke-hero-platform"></div>
            <div class="poke-hero-sprite" id="pokeHeroSprite"><img src="${pokePlayerSprite('back')}" alt="You" style="width:100%; height:100%; object-fit:contain; object-position:bottom;"/></div>
          </div>
        </div>
        <div class="poke-hud hero">
          <div class="pname">${playerName || 'YOU'}</div>
          <div class="poke-hp-outer"><div class="poke-hp-inner" id="pokeHeroBar" style="width:${heroPct}%; background:${heroColor};"></div></div>
          <div class="poke-hp-numbers">MP ${Math.round(heroPct)}%</div>
        </div>
      </div>
    </div>
    <div class="poke-bottom">${bottomHtml}</div>
  `;
}

let pokeCurrentOptOrder = null;

function pokeAnswer(displayIdx){
  const npc = owActiveQuest;
  const qItem = npc.quiz[pokeState.quizOrder[pokeState.qIdx % pokeState.quizOrder.length]];
  const order = pokeCurrentOptOrder;
  const origAnsweredIdx = order[displayIdx];
  const correctDisplayIdx = order.indexOf(qItem.correct);
  const btns = document.querySelectorAll('#pokeMoves .poke-move');
  btns.forEach(b=>b.disabled = true);
  const textEl = document.getElementById('pokeText');
  const villagerSprite = document.getElementById('pokeVillagerSprite');
  const heroSprite = document.getElementById('pokeHeroSprite');

  if(origAnsweredIdx===qItem.correct){
    btns[displayIdx].classList.add('correct');
    sfxCorrect();
    const heal = npc.examReview ? 10 : 22;
    pokeState.villagerHP = Math.min(pokeState.villagerMax, pokeState.villagerHP+heal);
    villagerSprite.classList.add('heal-pulse');
    setTimeout(()=>{ villagerSprite.classList.remove('heal-pulse'); }, 1100);
    pokeState.correct++;
    textEl.innerHTML = `✨ Correct! ${npc.name} recovers ${heal} HP!`;
  } else {
    btns[displayIdx].classList.add('wrong'); btns[correctDisplayIdx].classList.add('correct');
    sfxWrong();
    const drain = npc.examReview ? 10 : 22;
    pokeState.heroMP = Math.max(0, pokeState.heroMP-drain);
    pokeState.wrongCount++;
    heroSprite.classList.add('misfire');
    setTimeout(()=>{ heroSprite.classList.remove('misfire'); }, 1100);
    textEl.innerHTML = `💫 Not quite... the spell falters. You lose ${drain} MP.`;
  }
  updatePokeBars();

  setTimeout(()=>{
    if(pokeState.villagerHP>=pokeState.villagerMax){ endPokeBattle(true); return; }
    if(pokeState.heroMP<=0){ endPokeBattle(false); return; }
    pokeState.qIdx++;
    if(pokeState.qIdx >= pokeState.quizOrder.length){
      pokeState.quizOrder = buildQuizOrder(npc);
      pokeState.qIdx = 0;
    }
    renderPokeBattle("", false);
  }, 1900);
}

function updatePokeBars(){
  const villagerPct = Math.max(0, pokeState.villagerHP/pokeState.villagerMax*100);
  const heroPct = Math.max(0, pokeState.heroMP/pokeState.heroMax*100);
  const villagerColor = villagerPct>=100?'var(--green)':villagerPct>=50?'var(--yellow)':'#d9822b';
  const heroColor = heroPct>50?'var(--blue)':heroPct>25?'var(--yellow)':'var(--red)';
  const vBar = document.getElementById('pokeVillagerBar'); const hBar = document.getElementById('pokeHeroBar');
  if(vBar){ vBar.style.width = villagerPct+'%'; vBar.style.background = villagerColor; }
  if(hBar){ hBar.style.width = heroPct+'%'; hBar.style.background = heroColor; }
  const numEls = document.querySelectorAll('.poke-hp-numbers');
  if(numEls[0]) numEls[0].textContent = 'HP ' + Math.round(villagerPct)+'%';
  if(numEls[1]) numEls[1].textContent = 'MP ' + Math.round(heroPct)+'%';
}

function endPokeBattle(won){
  const npc = owActiveQuest;
  owBattleActive = false;
  if(won){
    let stars;
    if(pokeState.wrongCount===0) stars = 3;
    else if(pokeState.wrongCount<=2) stars = 2;
    else stars = 1;
    const wasFirst = CP()[npc.topicIdx] === 0;
    if(stars > CP()[npc.topicIdx]){ CP()[npc.topicIdx] = stars; saveProgressLocal(); cloudSyncProgress(); }
    if(npc.examReview && npc.topicKey){
      const prevExamStars = EXAM_PROGRESS[npc.topicKey] || 0;
      if(stars > prevExamStars){ EXAM_PROGRESS[npc.topicKey] = stars; saveExamProgressLocal(); cloudSyncExamProgress(); }
    }
    sfxWin();
    if(currentLocationKey){ /* rendered local map: HUD/marker refresh happens when we return via closePokeBattle */ }
    else { owUpdateHud(); owRender(); }
    const villagerSprite = document.getElementById('pokeVillagerSprite');
    if(villagerSprite) villagerSprite.classList.add('fully-healed');
    setTimeout(()=>{
      pokeArena.innerHTML = `
        <div class="poke-result">
          <div class="big">${randomVictoryLine()}</div>
          <div class="poke-result-stars" id="pokeResultStars">
            <span class="star-slot" id="starSlot0">☆</span><span class="star-slot" id="starSlot1">☆</span><span class="star-slot" id="starSlot2">☆</span>
          </div>
          <div class="poke-result-stat">${wasFirst? npc.thanks : "Great review!"}</div>
          <button class="pixel-btn" onclick="closePokeBattle()">▶ CONTINUE EXPLORING</button>
        </div>`;
      animateStarStamps(stars);
    }, 950);
  } else {
    pokeArena.innerHTML = `
      <div class="poke-result">
        <div class="big" style="color:var(--red-dark);">Out of energy...</div>
        <div class="poke-result-stat">Your magic falters. ${npc.name} will wait for your return.<br>Rest up, review the lesson, and try again!</div>
        <button class="pixel-btn red" onclick="closePokeBattle()">↺ RETURN TO MAP</button>
      </div>`;
  }
}

function animateStarStamps(starCount){
  for(let i=0;i<starCount;i++){
    setTimeout(()=>{
      const slot = document.getElementById('starSlot'+i);
      if(!slot) return;
      slot.textContent = '⭐';
      slot.classList.add('stamp');
      sfxStarStamp(i);
    }, 300 + i*380);
  }
}

function closePokeBattle(){
  owBattleActive = false;
  if(currentLocationKey){
    const region = REGIONS[currentRegionKey];
    const loc = region.locations.find(l=>l.key===currentLocationKey);
    renderLocalMap(loc);
    showScreen('screen-localmap');
  } else {
    showScreen('screen-overworld');
    owRender();
  }
}

function owOpenEnding(){
  const totalStars = CP().reduce((a,b)=>a+b,0);
  owOpenModal(`<div class="modal-head"><div class="em">🏆</div><div class="nm">GATE KEEPER</div></div>
    <div class="modal-text" style="text-align:center;">
      🎉 THE GATE OPENS! 🎉<br><br>You helped every quest-giver in the realm and mastered<br>
      <b>${SUBJECTS[currentSubjectKey].label}!</b><br><br>
      Total Stars: ${totalStars} / ${CT().length*3}<br><br>★ YOU ARE A TRUE EXPLORER ★
    </div>
    <div class="modal-btnrow"><button class="pixel-btn" onclick="owCloseModal()">KEEP EXPLORING</button></div>`);
  sfxWin();
}
function owUpdateHud(){
  const prog = CP(); const doneCount = prog.filter(s=>s>0).length; const totalStars = prog.reduce((a,b)=>a+b,0);
  document.getElementById('owHudQuests').textContent = doneCount;
  document.getElementById('owHudTotal').textContent = CT().length;
  document.getElementById('owHudStars').textContent = totalStars;
}


/* ============================================================
   REGION MAP & RENDERED LOCAL MAP NAVIGATION
   ============================================================ */
let currentRegionKey = "windyplains";
let currentLocationKey = null;

function regionStarsForSubject(subjectKey){
  const prog = PROGRESS[subjectKey];
  return prog.reduce((a,b)=>a+b,0);
}
function regionMaxStarsForSubject(subjectKey){
  return SUBJECTS[subjectKey].topics.length * 3;
}
function regionLocationComplete(subjectKey){
  // "requires at least 1 star per topic to complete"
  return PROGRESS[subjectKey].every(s=>s>0);
}
function regionLocationMastered(subjectKey){
  // "3 stars per topic will tag the location as mastered"
  return PROGRESS[subjectKey].every(s=>s>=3);
}
function examReviewMastered(subjectKey){
  // True only when EVERY exam-review (pool) topic at this location has 3 stars specifically
  // earned against its exam-review pool (EXAM_PROGRESS) — NOT the topic's regular all-time
  // best (PROGRESS), which may already be 3 from before the topic became exam-review content.
  // A location with no exam-review topics returns false (nothing to master).
  const topics = SUBJECTS[subjectKey].topics;
  const poolTopics = topics.filter(t=>t.examReview);
  if(poolTopics.length === 0) return false;
  return poolTopics.every(t => (EXAM_PROGRESS[t.key]||0) >= 3);
}
function subjectShortLabel(subjectKey){
  // Short/abbreviated form for compact UI (region map pins, local map info bar).
  // Only Araling Panlipunan's full label ("ARALING PANLIPUNAN") is too long to use as-is;
  // every other subject's existing label is already short enough to reuse directly.
  const overrides = { ap: "AP" };
  return overrides[subjectKey] || SUBJECTS[subjectKey].label;
}
function totalStarsForRegion(regionKey){
  const region = REGIONS[regionKey];
  if(!region) return 0;
  return region.locations.reduce((sum,loc)=>sum + regionStarsForSubject(loc.subject), 0);
}
function totalStarsAllRegions(){
  return Object.keys(REGIONS).reduce((sum,rk)=>sum + totalStarsForRegion(rk), 0);
}

function goToRegionMap(){
  currentSubjectKey = null;
  currentLocationKey = null;
  renderRegionMap();
  showScreen('screen-region');
}

async function openLeaderboard(){
  showScreen('screen-leaderboard');
  const body = document.getElementById('leaderboardBody');
  body.innerHTML = `<div class="lb-loading">Loading leaderboard...</div>`;

  if(!cloudUser){
    body.innerHTML = `<div class="lb-empty">Sign in with Google to see the leaderboard and join the rankings! ⭐</div>`;
    return;
  }
  if(!firebaseReady){
    body.innerHTML = `<div class="lb-error">Couldn't connect just yet. Try again in a moment.</div>`;
    return;
  }

  const result = await window.LQFirebase.getLeaderboard(20);
  if(!result.ok){
    body.innerHTML = `<div class="lb-error">Couldn't load the leaderboard right now. Please try again later.</div>`;
    return;
  }
  if(!result.rows || result.rows.length === 0){
    body.innerHTML = `<div class="lb-empty">No one's on the leaderboard yet.<br>Sign in and earn some stars to be the first! ⭐</div>`;
    return;
  }

  const medalRank = (i)=>{
    if(i===0) return '🥇';
    if(i===1) return '🥈';
    if(i===2) return '🥉';
    return String(i+1);
  };
  const rankClass = (i)=>{
    if(i===0) return 'lb-top1';
    if(i===1) return 'lb-top2';
    if(i===2) return 'lb-top3';
    return '';
  };

  body.innerHTML = result.rows.map((row, i)=>{
    const isMe = cloudUser && row.uid === cloudUser.uid;
    const name = row.playerName || row.displayName || 'Adventurer';
    const pic = row.photoURL
      ? `<img class="lb-pic" src="${row.photoURL}" alt=""/>`
      : `<div class="lb-pic" style="display:flex;align-items:center;justify-content:center;font-size:16px;">👤</div>`;
    return `
      <div class="lb-row ${isMe ? 'lb-me' : ''}">
        <div class="lb-rank ${rankClass(i)}">${medalRank(i)}</div>
        ${pic}
        <div class="lb-name">${name}${isMe ? ' (You)' : ''}</div>
        <div class="lb-stars">⭐ ${row.totalStars || 0}</div>
      </div>`;
  }).join('');
}

function renderRegionTabs(){
  const tabs = document.getElementById('termTabs');
  tabs.innerHTML = Object.keys(REGIONS).map(rk=>{
    const r = REGIONS[rk];
    const cls = 'term-tab' + (rk===currentRegionKey?' active':'') + (!r.unlocked?' locked':'');
    return `<div class="${cls}" onclick="${r.unlocked?`selectRegion('${rk}')`:''}">${r.label}${r.unlocked?'':' 🔒'}</div>`;
  }).join('');
  const totalEl = document.getElementById('grandTotalStars');
  if(totalEl) totalEl.textContent = `⭐ ${totalStarsAllRegions()} total`;
}
function selectRegion(rk){
  if(!REGIONS[rk].unlocked) return;
  currentRegionKey = rk;
  renderRegionMap();
}

function renderRegionMap(){
  renderRegionTabs();
  const region = REGIONS[currentRegionKey];
  const box = document.getElementById('regionImgBox');
  if(!region.unlocked || !region.image){
    box.innerHTML = `<div class="region-img-frame"><div style="padding:60px 20px; text-align:center; color:var(--text-dim); font-family:'Baloo 2',cursive;">🔒 This region is locked.<br>Complete the current region to unlock it.</div></div>`;
    return;
  }
  const imgSrc = REGION_IMAGES[region.image];
  let zonesHtml = region.locations.map(loc=>{
    const subj = SUBJECTS[loc.subject];
    const stars = regionStarsForSubject(loc.subject);
    const maxStars = regionMaxStarsForSubject(loc.subject);
    const mastered = regionLocationMastered(loc.subject);
    const starDisplay = mastered ? '⭐⭐⭐' : (stars>0 ? `⭐ ${stars}/${maxStars}` : '');
    const hasExamReview = subj.topics.some(t=>t.examReview);
    const examMastered = hasExamReview && examReviewMastered(loc.subject);
    const size = loc.size !== undefined ? loc.size : 15;
    // sizeY lets the tap zone be an ellipse (independent height-to-width ratio) rather than a
    // fixed circle. Defaults to matching size, so any location without sizeY set behaves exactly
    // as before.
    //
    // Region map images are always 3:2 (width:height). A CSS "width:X%" is a % of the box's own
    // width, but "height:X%" is a % of the PARENT's height — a different reference frame. For
    // size === sizeY to render as a true circle (matching pixel width and height), the height
    // percentage must be scaled by the image's aspect ratio (1.5) to compensate.
    const sizeY = loc.sizeY !== undefined ? loc.sizeY : size;
    const heightPct = sizeY * 1.5;
    return `
      <div class="region-zone" style="left:${loc.cx}%; top:${loc.cy}%; width:${size}%; height:${heightPct}%;" onclick="pickRegionLocation('${loc.key}')">
        <div class="region-zone-inner"></div>
        <div class="region-zone-label"><span class="region-zone-name-line">${loc.name} <span class="region-zone-subject">- ${subjectShortLabel(loc.subject)}</span>${hasExamReview ? (examMastered ? '<span class="exam-review-badge exam-review-badge-inline exam-review-badge-done" title="All exam review topics mastered">✓</span>' : '<span class="exam-review-badge exam-review-badge-inline" title="Exam review topics available">!</span>') : ''}</span>${starDisplay?`<div class="region-zone-stars">${starDisplay}</div>`:''}</div>
      </div>`;
  }).join('');
  // The image lives in its own clipped (rounded-corner) frame; zone markers/labels sit in an
  // unclipped sibling layer positioned identically over it, so labels near the image edge
  // can spill slightly past the border without being cut off by overflow:hidden.
  box.innerHTML = `<div class="region-img-frame"><img src="${imgSrc}" alt="${region.label}"/></div><div class="region-zones-layer">${zonesHtml}</div>`;
}

function pickRegionLocation(locKey){
  const region = REGIONS[currentRegionKey];
  const loc = region.locations.find(l=>l.key===locKey);
  if(!loc) return;
  sfxSelect();
  currentSubjectKey = loc.subject;
  if(loc.image && LOCATION_IMAGES[loc.image] && LOCATION_NPC_SPOTS[loc.image]){
    currentLocationKey = locKey;
    renderLocalMap(loc);
    showScreen('screen-localmap');
  } else {
    currentLocationKey = null;
    // fallback to existing canvas overworld for locations without rendered art yet
    initOverworld();
    showScreen('screen-overworld');
  }
}

function renderLocalMap(loc){
  const subj = SUBJECTS[loc.subject];
  const topics = subj.topics;
  const prog = PROGRESS[loc.subject];
  const doneCount = prog.filter(s=>s>0).length;
  const totalStars = prog.reduce((a,b)=>a+b,0);
  document.getElementById('localHudQuests').textContent = doneCount;
  document.getElementById('localHudTotal').textContent = topics.length;
  document.getElementById('localHudLocationTitle').textContent = `${loc.name} - ${subjectShortLabel(loc.subject)}`;
  document.getElementById('localHudStars').textContent = totalStars;
  document.getElementById('localHudMaxStars').textContent = topics.length * 3;

  const box = document.getElementById('localMapImgBox');
  const imgSrc = LOCATION_IMAGES[loc.image];
  const spots = LOCATION_NPC_SPOTS[loc.image];
  let npcHtml = topics.map((t,i)=>{
    const spot = spots[i % spots.length];
    const stars = prog[i];
    const starDisplay = stars>0 ? `${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}` : '';
    const spriteSrc = spot.sprite ? NPC_SPRITES[spot.sprite] : null;
    const size = spot.size !== undefined ? spot.size : (spriteSrc ? 9 : 11);
    // Sprites face right by default; flip to face left (toward map center) when standing on the right half
    const faceLeft = spot.x > 50;
    const spriteInner = spriteSrc
      ? `<img class="npc-sprite-img" src="${spriteSrc}" style="transform:translateX(-50%) scaleX(${faceLeft?-1:1});" alt="${t.name}"/>`
      : `<div class="npc-marker-icon">${t.icon}</div>`;
    return `
      <div class="npc-zone" style="left:${spot.x}%; top:${spot.y}%; width:${size}%;" onclick="pickLocalMapNpc(${i})">
        ${starDisplay?`<div class="npc-zone-stars">${starDisplay}</div>`:''}
        ${t.examReview ? ((EXAM_PROGRESS[t.key]||0) >= 3 ? '<div class="exam-review-badge npc-exam-badge exam-review-badge-done" title="Exam review topic mastered">✓</div>' : '<div class="exam-review-badge npc-exam-badge" title="Exam review topic">!</div>') : ''}
        <div class="npc-marker ${spriteSrc?'has-sprite':''}">${spriteInner}</div>
      </div>`;
  }).join('');
  box.innerHTML = `<div class="localmap-img-frame"><img src="${imgSrc}" alt="${loc.name}"/></div><div class="localmap-zones-layer">${npcHtml}</div>`;
}

function pickLocalMapNpc(topicIdx){
  const topic = CT()[topicIdx];
  const region = REGIONS[currentRegionKey];
  const loc = region.locations.find(l=>l.key===currentLocationKey);
  const spots = loc ? LOCATION_NPC_SPOTS[loc.image] : null;
  const spot = spots ? spots[topicIdx % spots.length] : null;
  const npc = {
    topicIdx, col:0, row:0,
    title: topic.title, icon: topic.icon, color: topic.color,
    name: topic.name, greet: topic.greet, lesson: topic.lesson, thanks: topic.thanks, quiz: topic.quiz,
    sprite: spot ? spot.sprite : null, examReview: topic.examReview, topicKey: topic.key
  };
  startPokeBattle(npc);
}


/* init */
const hadSavedProfile = loadPlayerProfile();
loadProgressLocal();
loadExamProgressLocal();
goToRegionMap();
updateSignInUI();
if(!hadSavedProfile){ openCharacterSelect(); }
</script>
